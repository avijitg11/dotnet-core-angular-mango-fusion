<div class="border rounded-2 p-3">
    <div class="d-flex justify-content-between flex-wrap gap-3 mb-2">
        <img src="{{baseUrl + orderDetail().menuItem.image }}"
        (error)="$any($event.target).src = 'https://placehold.co/100'"
        class="rounded" style="width:50px;height:50px;object-fit:cover" />
        <div class="flex-grow-1">
            <div class="fw-semibold">
                {{orderDetail().itemName}}
                <span class="badge bg-secondary m-1">{{orderDetail().menuItem.category}}</span>
                <span class="badge bg-warning text-dark m-1">{{orderDetail().menuItem.specialTag}}</span>
            </div>
            <div class="small text-muted">Qty {{orderDetail().quantity}} × ₹ {{orderDetail().price}}</div>
        </div>
        <div>
            {{orderDetail().menuItem.description}}
        </div>
    </div>
    <div class="mt-3 pt-3 border-top bg-light rounded p-3">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <h6 class="mb-1 fw-semibold small text-primary">                    
                    Rate this item : 
                    <app-rating [(value)]="rating" (click)="onClick()" [disabled]="isDisabled()"></app-rating>                    
                </h6>
                @if(rating()>0){
                    <span class="text-success small fw-semibold">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        Rated
                    </span>
                }                
            </div>
        </div>
    </div>
</div>
